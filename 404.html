
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <meta name="robots" content="noindex">
  <title>Opening Page | RR Brothers</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #080808;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .card {
      width: 100%;
      max-width: 440px;
      padding: 36px 24px;
      background: #111;
      border: 1px solid #292929;
      border-radius: 18px;
    }

    .logo {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 22px;
    }

    .logo span {
      color: #00d9ff;
    }

    .loader {
      width: 38px;
      height: 38px;
      margin: 24px auto;
      border: 3px solid #333;
      border-top-color: #00d9ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    h1 {
      font-size: 23px;
      margin-bottom: 12px;
    }

    p {
      color: #aaa;
      line-height: 1.7;
      font-size: 14px;
    }

    a {
      display: inline-block;
      margin-top: 18px;
      padding: 13px 22px;
      border-radius: 8px;
      background: #00d9ff;
      color: #000;
      text-decoration: none;
      font-weight: 700;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .loader {
        animation: none;
      }
    }
  </style>

  <script>
    (function () {
      const currentPath = window.location.pathname;

      // Opening the 404 file directly should return home.
      if (currentPath === "/404.html") {
        window.location.replace("/");
        return;
      }

      // Preserve the requested path, query and hash.
      const requestedPath =
        currentPath +
        window.location.search +
        window.location.hash;

      // Pass the requested URL to the main website.
      const destination = new URL("/", window.location.origin);
      destination.searchParams.set("__rrb_path", requestedPath);

      window.location.replace(destination.toString());
    })();
  </script>
</head>

<body>
  <main class="card">
    <div class="logo">RR <span>BROTHERS</span></div>

    <div class="loader" aria-hidden="true"></div>

    <h1>Opening your page...</h1>

    <p>
      Please wait while we open your requested page.
      You will be redirected automatically.
    </p>

    <a href="/">Go to Homepage</a>
  </main>
</body>
</html>
